name: Setup Customer Environment

on:
  create:

permissions:
  contents: read

jobs:
  setup-environment:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Set Environment Name
        id: env
        run: |
          echo "env_name=${{ github.event.ref }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Environment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ENV_NAME: ${{ steps.env.outputs.env_name }}
        run: |
          echo "Creating environment: $ENV_NAME"

          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/environments/$ENV_NAME"

      - name: Configure Branch Policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ENV_NAME: ${{ steps.env.outputs.env_name }}
        run: |
          echo "Configuring branch policy for: $ENV_NAME"

          EXISTING_POLICY=$(
            gh api \
              "/repos/${{ github.repository }}/environments/$ENV_NAME/deployment-branch-policies" \
              2>/dev/null \
            | jq -r --arg BRANCH "$ENV_NAME" \
              '.branch_policies[]? | select(.name==$BRANCH) | .name'
          )

          if [[ "$EXISTING_POLICY" == "$ENV_NAME" ]]; then
            echo "Branch policy already exists."
            exit 0
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/environments/$ENV_NAME/deployment-branch-policies" \
            -f name="$ENV_NAME" \
            -f type="branch"

      - name: Create Environment Variables
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ENV_NAME: ${{ steps.env.outputs.env_name }}
        run: |

          VARIABLES=(
            "SOURCE_GL_SERVER_URL"
            "GITLAB_USERNAME"
            "GH_HOST"
            "GL_EXPORTER_REPO_URL"
            "STORAGE_TYPE"
            "AZ_CONTAINER"
            "AWS_BUCKET_NAME"
            "AWS_REGION"
          )

          for VAR in "${VARIABLES[@]}"; do

            gh variable set "$VAR" \
              --env "$ENV_NAME" \
              --repo "${{ github.repository }}" \
              --body "__SET_ME__"

            echo "Created variable: $VAR"

          done

      - name: Create Environment Secrets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ENV_NAME: ${{ steps.env.outputs.env_name }}
        run: |

          SECRETS=(
            "GITLAB_API_PRIVATE_TOKEN"
            "GH_PAT"
            "GLXREPO_GH_PAT"
            "AZURE_STORAGE_CONNECTION_STRING"
            "AWS_ACCESS_KEY_ID"
            "AWS_SECRET_ACCESS_KEY"
          )

          for SECRET in "${SECRETS[@]}"; do

            echo "__SET_ME__" | gh secret set "$SECRET" \
              --env "$ENV_NAME" \
              --repo "${{ github.repository }}"

            echo "Created secret: $SECRET"

          done

      - name: Setup Summary
        env:
          ENV_NAME: ${{ steps.env.outputs.env_name }}
        run: |
          echo ""
          echo "======================================="
          echo " Environment Setup Complete"
          echo "======================================="
          echo " Environment : $ENV_NAME"
          echo " Branch      : $ENV_NAME"
          echo ""
          echo " Created Variables:"
          echo "   SOURCE_GL_SERVER_URL"
          echo "   GITLAB_USERNAME"
          echo "   GH_HOST"
          echo "   GL_EXPORTER_REPO_URL"
          echo "   STORAGE_TYPE"
          echo "   AZ_CONTAINER"
          echo "   AWS_BUCKET_NAME"
          echo "   AWS_REGION"
          echo ""
          echo " Created Secrets:"
          echo "   GITLAB_API_PRIVATE_TOKEN"
          echo "   GH_PAT"
          echo "   GLXREPO_GH_PAT"
          echo "   AZURE_STORAGE_CONNECTION_STRING"
          echo "   AWS_ACCESS_KEY_ID"
          echo "   AWS_SECRET_ACCESS_KEY"
          echo ""
          echo " Next Step:"
          echo " Populate values in GitHub Environment."
          echo " Migration workflow remains unchanged."
          echo "======================================="
